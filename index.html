    <title>ASGARD PORTAL v7.02</title>
    <style>
        /* Tinatanggal ang white spaces sa gilid at pinupuno ang buong screen */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background-color: #000000; /* Pwedeng palitan ang kulay habang naglo-load ang page */

        /* Ginagawang fullscreen ang iyong Google App Script */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
        }
    </style>
</head>
